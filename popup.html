<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube 双语直播字幕</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="header-top">
        <span class="badge"><i class="dot"></i>YouTube 实时同传</span>
        <span class="version">v2.2</span>
      </div>
      <h1>双语直播字幕</h1>
      <p class="subtitle">无 CC 外语直播 · 流式识别与上下文翻译</p>
    </header>

    <form>
      <section class="card">
        <div class="card-title">语音识别</div>
        <label for="asr-provider">识别引擎</label>
        <select id="asr-provider">
          <option value="openai-live">OpenAI 低延迟直播（$1.02 / 小时）</option>
          <option value="openai">OpenAI 经济转写（约 $0.18 / 小时）</option>
          <option value="deepgram">Deepgram Nova-3</option>
          <option value="openai-http">OpenAI 兼容转写（gpt-4o-mini-transcribe · 稳定）</option>
        </select>

        <label for="asr-key" id="asr-key-label">OpenAI API 密钥</label>
        <input id="asr-key" type="password" autocomplete="off" spellcheck="false" maxlength="512">

        <label for="source-language">直播原语（指定可提升嘈杂直播准确率）</label>
        <select id="source-language"></select>
      </section>

      <section class="card">
        <div class="card-title">双语翻译</div>
        <label for="subtitle-mode">字幕模式</label>
        <select id="subtitle-mode">
          <option value="dual">原文 + 上下文实时翻译</option>
          <option value="original">仅显示实时原文</option>
        </select>

        <div id="translate-settings">
          <label for="translate-provider">翻译引擎（流式输出）</label>
          <select id="translate-provider">
            <option value="openai">OpenAI（GPT-6 Luna）</option>
            <option value="deepseek">DeepSeek（deepseek-chat）</option>
          </select>

          <div id="translate-key-group" hidden>
            <label for="translate-key" id="translate-key-label">DeepSeek API 密钥</label>
            <input id="translate-key" type="password" autocomplete="off" spellcheck="false" maxlength="512">
          </div>
          <p class="shared-pill" id="shared-key-note">已自动共用上方 OpenAI API 密钥</p>

          <label for="target-language">翻译目标语言</label>
          <select id="target-language"></select>
        </div>
      </section>

      <button id="toggle" type="submit" disabled>启动实时字幕</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <div class="footer-row">
      <span class="muted">密钥仅保存在本机 Chrome 中</span>
      <button id="forget" type="button" hidden>清除密钥</button>
    </div>
  </main>
</body>
</html>
